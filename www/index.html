<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>異獸紀行：穿越時代的獵人</title>
<style>
  :root{
    --bg-0:#0c0a12;
    --bg-1:#171320;
    --panel:#1f1a2c;
    --panel-border:#3a3050;
    --ink:#f1e9ff;
    --ink-dim:#b8a9d9;
    --accent:#e0a83c;
    --accent-2:#7fd0c8;
    --hp:#e0526b;
    --hp-dim:#5a2a34;
    --good:#79d17e;
    --bad:#e0526b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at 50% -10%, #241d38 0%, var(--bg-0) 60%);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;padding:14px;gap:10px;
  }
  #frame{
    position:relative;
    width:min(96vw, 960px);
    border-radius:14px;
    background:linear-gradient(180deg,var(--bg-1),#100d18);
    border:1px solid var(--panel-border);
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);
    padding:12px;
  }
  #hud{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:8px 10px;margin-bottom:8px;
    background:rgba(0,0,0,.25);border-radius:10px;border:1px solid var(--panel-border);
    font-size:13px;
  }
  .hud-group{display:flex;align-items:center;gap:6px;}
  .hud-label{color:var(--ink-dim);font-size:11px;letter-spacing:.05em;}
  #hpHearts{display:flex;gap:3px;}
  .heart{width:16px;height:16px;position:relative;}
  .heart svg{width:100%;height:100%;display:block;}
  #powerVal, #eraVal{color:var(--accent);font-weight:700;}
  #killCount{color:var(--accent-2);font-weight:700;}
  .spacer{flex:1;}
  #skillBadge{
    display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
    background:rgba(224,168,60,.12);border:1px solid rgba(224,168,60,.4);
    font-size:12px;cursor:default;
  }
  #skillBadge.ready{box-shadow:0 0 10px rgba(224,168,60,.5);}
  #skillBadge.cooling{opacity:.5;}
  canvas{
    display:block;width:100%;height:auto;background:#0a0810;border-radius:10px;
    image-rendering:optimizeQuality;
    border:1px solid #2a2340;
  }
  #overlay{
    position:absolute;inset:12px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(6,4,12,.86);backdrop-filter:blur(2px);
    z-index:20;
  }
  #overlay.hidden{display:none;}
  .panel{
    width:min(90%, 640px);max-height:88%;overflow-y:auto;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
    padding:26px 28px;text-align:center;
  }
  .panel h1{font-size:26px;margin:0 0 6px;color:var(--accent);letter-spacing:.04em;}
  .panel h2{font-size:19px;margin:18px 0 8px;color:var(--accent-2);}
  .panel p{color:var(--ink-dim);line-height:1.7;font-size:14px;margin:6px 0;}
  .panel .tag{
    display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;
    background:rgba(127,208,200,.12);border:1px solid rgba(127,208,200,.35);color:var(--accent-2);
    margin:2px 3px;
  }
  .btn{
    appearance:none;border:none;cursor:pointer;
    background:linear-gradient(180deg,#e0a83c,#c4842a);
    color:#241708;font-weight:700;font-size:15px;
    padding:11px 26px;border-radius:10px;margin-top:14px;
    box-shadow:0 4px 0 #8a5f1c, 0 8px 16px rgba(0,0,0,.35);
    transition:transform .05s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5f1c;}
  .btn.secondary{
    background:linear-gradient(180deg,#3a3050,#241f34);color:var(--ink);
    box-shadow:0 4px 0 #150f22, 0 8px 16px rgba(0,0,0,.3);
  }
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .keys{
    display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;
    max-width:380px;margin:10px auto;font-size:13px;color:var(--ink-dim);
  }
  .keys b{color:var(--ink);}
  .lootline{
    display:flex;align-items:center;gap:10px;justify-content:center;
    background:rgba(255,255,255,.03);border-radius:8px;padding:8px 12px;margin:6px 0;
    font-size:13px;
  }
  .src-list{text-align:left;font-size:12px;color:var(--ink-dim);line-height:1.9;margin-top:10px;}
  .src-list b{color:var(--accent-2);}
  #infoBtn, #muteBtn{
    background:rgba(255,255,255,.06);border:1px solid var(--panel-border);color:var(--ink-dim);
    border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12px;
  }
  #touchpad{display:none;gap:8px;justify-content:space-between;margin-top:8px;width:100%;}
  .tbtn{
    flex:1;padding:14px 0;text-align:center;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid var(--panel-border);
    font-size:13px;color:var(--ink-dim);
  }
  @media (pointer:coarse){ #touchpad{display:flex;} }
  #toast{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.7);border:1px solid var(--panel-border);
    padding:6px 16px;border-radius:20px;font-size:13px;color:var(--accent);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:15;
  }
  #toast.show{opacity:1;}
  #invBar{
    display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;
  }
  .invSlot{
    display:flex;align-items:center;gap:6px;
    background:rgba(0,0,0,.25);border:1px solid var(--panel-border);border-radius:10px;
    padding:5px 10px;font-size:12px;color:var(--ink);cursor:pointer;
    appearance:none;font-family:inherit;
  }
  .invSlot .invIcon{font-size:15px;}
  .invSlot .invKey{
    color:var(--ink-dim);font-size:10px;border:1px solid var(--panel-border);
    border-radius:4px;padding:0 4px;
  }
  .invSlot .invCount{color:var(--accent);font-weight:700;}
  .invSlot:disabled{opacity:.35;cursor:default;}
  .invSlot:not(:disabled):hover{border-color:var(--accent);}
  .invSlot:not(:disabled):active{transform:translateY(1px);}
  footer{color:var(--ink-dim);font-size:11px;text-align:center;max-width:900px;line-height:1.6;}
  /* ===== APP / 手機版面：全螢幕，觸控按鈕與道具列浮在遊戲畫面上 ===== */
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
  #frame{position:relative;}
  @media (pointer:coarse), (display-mode: standalone), (display-mode: fullscreen){
    #app{padding:max(4px,env(safe-area-inset-top)) max(4px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));gap:0;}
    #frame{width:100%;max-width:none;border-radius:8px;padding:4px;}
    footer{display:none;}
    #hud{padding:3px 8px;margin-bottom:4px;gap:10px;font-size:11px;}
    .heart{width:12px;height:12px;}
    canvas{width:auto;max-width:100%;max-height:calc(100dvh - 62px);margin:0 auto;}
    #invBar{position:absolute;right:14px;bottom:78px;margin:0;z-index:12;gap:6px;}
    .invSlot{padding:4px 8px;background:rgba(0,0,0,.55);}
    #touchpad{position:absolute;left:12px;right:12px;width:auto;bottom:12px;margin:0;z-index:12;pointer-events:none;gap:8px;justify-content:flex-start;}
    .tbtn{pointer-events:auto;flex:0 0 auto;width:72px;padding:0;height:58px;line-height:58px;font-size:14px;background:rgba(20,16,32,.55);border-color:rgba(255,255,255,.18);}
    #tJump{margin-left:auto;}
    #tLeft,#tRight{order:1;}
    #tJump,#tAttack,#tSkill{order:2;}
  }
</style>

<div id="app">
  <div id="frame">
    <div id="hud">

      <div class="hud-group"><span class="hud-label">武力</span><span id="powerVal">2D3+5</span></div>

      <button class="invSlot" id="invHeal" title="使用回復藥"><span class="invIcon">🧪</span>回復<span class="invCount" id="invHealCount">0</span><span class="invKey">1</span></button>
      <button class="invSlot" id="invAtk" title="使用力量藥劑"><span class="invIcon">⚔️</span>力量<span class="invCount" id="invAtkCount">0</span><span class="invKey">2</span></button>
      <button class="invSlot" id="invDef" title="使用防禦藥劑"><span class="invIcon">🛡️</span>防禦<span class="invCount" id="invDefCount">0</span><span class="invKey">3</span></button>

    鍵盤操作：← → 移動　↑ / Space 跳躍　X 攻擊　C 技能　1/2/3 使用道具（回復／力量／防禦）　I 圖鑑與出處<br>
    所有怪物、武器、防具皆為依據各地文化傳說之原創重繪與 DnD 式數值設計，非原網站圖像。
  </footer>
</div>

<script>
(function(){
"use strict";

/* ============================== 工具函式 ============================== */
function rollDie(sides){ return 1 + Math.floor(Math.random()*sides); }
function rollDice(diceStr){
  // "2D6+1" style
  const m = /^(\d+)D(\d+)([+-]\d+)?$/i.exec(diceStr);
  if(!m) return parseInt(diceStr)||1;
  const [,n,sides,mod] = m;
  let total=0;
  for(let i=0;i<parseInt(n);i++) total += rollDie(parseInt(sides));
  if(mod) total += parseInt(mod);
  return Math.max(1,total);
}
function rand(min,max){ return min + Math.random()*(max-min); }
function chance(p){ return Math.random() < p; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function aabb(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

/* ============================== 資料：時代 / 地區 / 出處 ============================== */
const SOURCES = {
  cn:  { label:"中國", cite:"《山海經》(整理參考 uedu.tw/shanhaijing)" },
  in:  { label:"中亞・印度", cite:"印度教／吠陀神話傳說（羅剎、那伽、夜叉等）" },
  jk:  { label:"日本・韓國", cite:"鳥山石燕《畫圖百鬼夜行》；韓國民間傳說（도깨비）" },
  we:  { label:"西歐", cite:"Global Folklore Bestiary — 西歐地區傳說生物" },
  af:  { label:"非洲", cite:"西非／中非／南非民間傳說（Ninki Nanka、Kongamato 等）" },
  ee:  { label:"東歐", cite:"Global Folklore Bestiary — 東歐地區傳說生物；斯拉夫民間傳說" },
  am:  { label:"美洲", cite:"北美原住民傳說與近代都市傳說" },
};

/* ============================== 怪物形狀繪製 ============================== */
// 所有怪物皆為程式產生之原創向量圖形（非任何網站圖片），造型依資料標記組合而成。
function drawMonsterIcon(ctx, m, x, y, w, h, facing, t){
  ctx.save();
  ctx.translate(x + w/2, y + h/2);
  if(facing < 0) ctx.scale(-1,1);
  const bob = Math.sin(t/160 + (m.seed||0)) * (h*0.03);
  ctx.translate(0, bob);
  const c1 = m.color1, c2 = m.color2;
  const s = Math.min(w,h);

  function legs(n, spread, ly, thick){
    ctx.strokeStyle = c2; ctx.lineWidth = thick;
    for(let i=0;i<n;i++){
      const lx = -spread/2 + (spread/(n-1||1))*i;
      const wag = Math.sin(t/90 + i*1.7 + (m.seed||0))*4*(m.walking?1:0.3);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx+wag, ly+h*0.22);
      ctx.stroke();
    }
  }
  function wings(spanY){
    const flap = Math.sin(t/70 + (m.seed||0)) * 0.5 + 0.5;
    ctx.fillStyle = c2;
    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    ctx.moveTo(-w*0.12, spanY);
    ctx.quadraticCurveTo(-w*0.55, spanY - h*0.32*flap, -w*0.5, spanY + h*0.12);
    ctx.quadraticCurveTo(-w*0.3, spanY + h*0.05, -w*0.12, spanY + h*0.14);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w*0.12, spanY);
    ctx.quadraticCurveTo(w*0.55, spanY - h*0.32*flap, w*0.5, spanY + h*0.12);
    ctx.quadraticCurveTo(w*0.3, spanY + h*0.05, w*0.12, spanY + h*0.14);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function eyes(n, ey, ew, col){
    ctx.fillStyle = col || "#fff2c8";
    for(let i=0;i<n;i++){
      const ex = (n===1)?0:(-ew/2 + (ew/(n-1))*i);
      ctx.beginPath(); ctx.arc(ex, ey, s*0.045,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#1a1220";
      ctx.beginPath(); ctx.arc(ex, ey, s*0.02,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = col || "#fff2c8";
    }
  }
  function horns(hy){
    ctx.strokeStyle = "#e9e2cf"; ctx.lineWidth = s*0.05; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(-w*0.12,hy); ctx.lineTo(-w*0.22,hy-h*0.22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w*0.12,hy); ctx.lineTo(w*0.22,hy-h*0.22); ctx.stroke();
  }

  ctx.lineJoin="round";
  switch(m.shape){
    case "serpent": {
      ctx.strokeStyle = c1; ctx.lineWidth = h*0.32; ctx.lineCap="round";
      ctx.beginPath();
      for(let i=-6;i<=6;i++){
        const px = i*(w/13);
        const py = Math.sin(t/140 + i*0.9 + (m.seed||0)) * h*0.14;
        if(i===-6) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
      ctx.fillStyle = c2;
      ctx.beginPath(); ctx.ellipse(w*0.42, Math.sin(t/140+5.4+(m.seed||0))*h*0.14, s*0.16, s*0.12,0,0,Math.PI*2); ctx.fill();
      eyes(2, Math.sin(t/140+5.4+(m.seed||0))*h*0.14 - s*0.02, s*0.14, "#c8ffe0");
      if(m.wings) wings(-h*0.02);
      break;
    }
    case "bird": {
      wings(-h*0.02);
      ctx.fillStyle = c1;
      ctx.beginPath(); ctx.ellipse(0,0,w*0.24,h*0.26,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w*0.24,-h*0.1,w*0.14,h*0.13,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = c2;
      ctx.beginPath(); ctx.moveTo(w*0.36,-h*0.1); ctx.lineTo(w*0.52,-h*0.05); ctx.lineTo(w*0.36,-h*0.02); ctx.closePath(); ctx.fill();
      eyes(1, -h*0.12, 0, "#fffbe6");
      if(m.horns) horns(-h*0.2);
      legs(2, w*0.14, h*0.16, s*0.035);
      break;
    }
    case "quad": {
      ctx.fillStyle = c1;
      ctx.beginPath(); ctx.ellipse(0,0,w*0.32,h*0.22,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w*0.3,-h*0.06,w*0.16,h*0.16,0,0,Math.PI*2); ctx.fill();
      legs(4, w*0.5, h*0.14, s*0.05);
      ctx.fillStyle = c2;
      if(m.tail){
        ctx.strokeStyle=c2; ctx.lineWidth=s*0.045; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(-w*0.3,0); ctx.quadraticCurveTo(-w*0.5,-h*0.15,-w*0.46,-h*0.3); ctx.stroke();
      }
      eyes(m.eyeCount||1, -h*0.1, w*0.1, "#fff2c8");
      if(m.horns) horns(-h*0.18);
      break;
    }
    case "biped": {
      ctx.fillStyle = c1;
      ctx.beginPath(); ctx.ellipse(0,h*0.02,w*0.2,h*0.26,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-h*0.24,w*0.15,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=c1; ctx.lineWidth=s*0.06; ctx.lineCap="round";
      const arm = Math.sin(t/110+(m.seed||0))*6;
      ctx.beginPath(); ctx.moveTo(-w*0.16,-h*0.05); ctx.lineTo(-w*0.32,h*0.08+arm); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w*0.16,-h*0.05); ctx.lineTo(w*0.32,h*0.08-arm); ctx.stroke();
      legs(2, w*0.18, h*0.24, s*0.06);
      eyes(m.eyeCount||2, -h*0.26, w*0.12, "#fff2c8");
      if(m.horns) horns(-h*0.36);
      if(m.wings) wings(-h*0.06);
      break;
    }
    case "blob": {
      ctx.fillStyle = c1;
      ctx.beginPath();
      const wob = Math.sin(t/130+(m.seed||0))*s*0.03;
      ctx.ellipse(0,0,w*0.3+wob,h*0.28-wob,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = c2;
      for(let i=0;i<3;i++){
        ctx.beginPath();
        ctx.ellipse(-w*0.15+i*w*0.15, h*0.22, s*0.05, s*0.09, 0,0,Math.PI*2);
        ctx.fill();
      }
      eyes(m.eyeCount||3, -h*0.06, w*0.22, "#e8ffe0");
      if(m.wings) wings(-h*0.1);
      break;
    }
  }
  ctx.restore();
}

function drawPlayerIcon(ctx, x, y, w, h, facing, t, state, weapon, armor){
  const wid = (weapon && weapon.id) || "w0";
  const wcol = (weapon && weapon.color) || "#d8d8e8";
  const acol = (armor && armor.color) || "#8a7a63";
  const ac = (armor && armor.ac) || 0;
  const run = state==='run', atk = state==='attack';
  const ph = run ? t/85 : 0;
  const bob = run ? Math.abs(Math.sin(ph))*1.6 : Math.sin(t/520)*0.5;
  const dark = c => shade(c,-0.35), light = c => shade(c,0.25);
  function shade(hex,k){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
    const f=v=>Math.max(0,Math.min(255,Math.round(k<0? v*(1+k) : v+(255-v)*k))); return `rgb(${f(r)},${f(g)},${f(b)})`; }
  ctx.save();
  ctx.translate(x+w/2, y+h);          // 腳底中心
  if(facing<0) ctx.scale(-1,1);
  const k = h/46*1.12; ctx.scale(k,k);
  // 地面陰影
  ctx.fillStyle="rgba(0,0,0,0.30)"; ctx.beginPath(); ctx.ellipse(0,1,12,3,0,0,6.2832); ctx.fill();
  ctx.lineCap="round"; ctx.lineJoin="round";
  const skin="#f0c896", skinD="#d9a877", hair="#2a1a14", boot="#3a281c", leather="#5a3a22", cloakC="#b8452f";
  const sway = Math.sin(t/260)*1.5 + (run?Math.sin(ph*2)*2.5:0);

  // 披風（背後）
  ctx.fillStyle=dark(cloakC);
  ctx.beginPath(); ctx.moveTo(-3,-20-bob); ctx.quadraticCurveTo(-13-sway,-8,-15-sway*1.4,12);
  ctx.lineTo(-9-sway*0.6,9); ctx.lineTo(-6-sway*0.3,13); ctx.lineTo(-2,5); ctx.closePath(); ctx.fill();
  ctx.fillStyle=cloakC;
  ctx.beginPath(); ctx.moveTo(-3,-20-bob); ctx.quadraticCurveTo(-10-sway,-10,-11-sway,6); ctx.lineTo(-3,-2); ctx.closePath(); ctx.fill();

  // 腿（後腿先畫）
  function leg(side, a, col){
    const hipX=side*3, hipY=-4-bob*0.3;
    const sw = run ? Math.sin(ph+a)*7 : side*1.8;
    const lift = run ? Math.max(0,Math.sin(ph+a+1.57))*3.2 : 0;
    const kx=hipX+sw*0.5, ky=hipY+9;
    const fx=hipX+sw, fy=22-lift;
    ctx.strokeStyle=col; ctx.lineWidth=4.6;
    ctx.beginPath(); ctx.moveTo(hipX,hipY); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy-3); ctx.stroke();
    // 靴
    ctx.fillStyle=boot; ctx.beginPath();
    ctx.moveTo(fx-3,fy-6); ctx.lineTo(fx+2.5,fy-6); ctx.lineTo(fx+7,fy-1); ctx.lineTo(fx+7,fy+1); ctx.lineTo(fx-3.5,fy+1); ctx.closePath(); ctx.fill();
    ctx.fillStyle=light(boot); ctx.fillRect(fx-3.4,fy-6.5,6.2,1.6);
  }
  leg(-1, 3.14, dark(acol)); leg(1, 0, shade(acol,-0.15));

  // 後手
  const armBase = {x:-1.5, y:-17-bob};
  function arm(col, ang1, ang2, sleeve){
    const sx=armBase.x, sy=armBase.y;
    const ex=sx+Math.cos(ang1)*7, ey=sy+Math.sin(ang1)*7;
    const hx=ex+Math.cos(ang2)*6.5, hy=ey+Math.sin(ang2)*6.5;
    ctx.strokeStyle=sleeve; ctx.lineWidth=4.4; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=3.6; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(hx,hy); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(hx,hy,2.1,0,6.2832); ctx.fill();
    return {x:hx,y:hy};
  }
  const bs = run ? Math.sin(ph+3.14)*0.7 : Math.sin(t/520)*0.05;
  arm(skinD, 1.4+bs, 1.1+bs*0.5, dark(acol));

  // 軀幹
  const g=ctx.createLinearGradient(-7,-22,7,2); g.addColorStop(0,light(acol)); g.addColorStop(1,dark(acol));
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(-6,-20-bob); ctx.quadraticCurveTo(0,-23-bob,6,-20-bob);
  ctx.lineTo(7,-4-bob*0.3); ctx.lineTo(-7,-4-bob*0.3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=0.8; ctx.stroke();
  // 衣襟、紋飾
  ctx.strokeStyle=light(acol); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,-21-bob); ctx.lineTo(1,-5-bob*0.3); ctx.stroke();
  if(ac>=3){ ctx.fillStyle="rgba(255,255,255,0.18)"; ctx.beginPath(); ctx.ellipse(-2.5,-14-bob,2.2,4,0.2,0,6.2832); ctx.fill(); }
  // 腰帶 + 帶扣
  ctx.fillStyle=leather; ctx.fillRect(-7.2,-8.4-bob*0.3,14.4,3.2);
  ctx.fillStyle="#e0b24a"; ctx.fillRect(-1.6,-8.6-bob*0.3,3.2,3.6);
  // 下擺
  ctx.fillStyle=dark(acol); ctx.beginPath(); ctx.moveTo(-7,-5-bob*0.3); ctx.lineTo(7,-5-bob*0.3); ctx.lineTo(8.5,1); ctx.lineTo(-8.5,1); ctx.closePath(); ctx.fill();
  // 護肩（防具越強越明顯）
  if(ac>=2){ ctx.fillStyle=light(acol); ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.ellipse(0,-20-bob,5.2+Math.min(ac,8)*0.35,3+Math.min(ac,8)*0.2,0,Math.PI,0); ctx.fill(); ctx.stroke(); }

  // 頭
  const hy=-28-bob;
  // 馬尾
  ctx.strokeStyle=hair; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-5,hy-3);
  ctx.quadraticCurveTo(-11-sway,hy-1,-12-sway*1.3,hy+7+Math.sin(t/200)*1); ctx.stroke();
  // 後頸
  ctx.fillStyle=skinD; ctx.fillRect(-2,hy+5,4,4);
  ctx.fillStyle=skin; ctx.beginPath(); ctx.ellipse(0,hy,6,6.6,0,0,6.2832); ctx.fill();
  // 頭髮
  ctx.fillStyle=hair; ctx.beginPath(); ctx.moveTo(-6.4,hy+0.5); ctx.quadraticCurveTo(-7,hy-8,0,hy-7.6); ctx.quadraticCurveTo(6.4,hy-7.6,6.5,hy-2);
  ctx.quadraticCurveTo(2,hy-4,-1,hy-3); ctx.quadraticCurveTo(-4,hy-2,-6.4,hy+0.5); ctx.fill();
  // 頭帶
  ctx.fillStyle="#d8453a"; ctx.fillRect(-6.5,hy-3.8,13,2.2);
  ctx.beginPath(); ctx.moveTo(-6,hy-2.8); ctx.lineTo(-11-sway,hy-1); ctx.lineTo(-9-sway*0.6,hy-4.4); ctx.closePath(); ctx.fill();
  // 臉：眼、眉、嘴、耳
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(2.8,hy+0.4,1.7,1.4,0,0,6.2832); ctx.fill();
  ctx.fillStyle="#1a0f08"; ctx.beginPath(); ctx.arc(3.3,hy+0.5,0.95,0,6.2832); ctx.fill();
  ctx.strokeStyle=hair; ctx.lineWidth=0.9; ctx.beginPath(); ctx.moveTo(1.2,hy-1.7); ctx.lineTo(4.6,atk?hy-2.6:hy-1.6); ctx.stroke();
  ctx.strokeStyle="#9a5a40"; ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(2.4,hy+3.4); ctx.quadraticCurveTo(3.6,hy+(atk?4.6:3.9),4.6,hy+3.2); ctx.stroke();
  ctx.fillStyle=skinD; ctx.beginPath(); ctx.ellipse(-2.6,hy+1.2,1.2,1.7,0,0,6.2832); ctx.fill();

  // 前手 + 武器
  const swing = atk ? -1.9 + ((t/60)%6)*0.0 : (run ? -0.2+Math.sin(ph)*0.6 : -0.15+Math.sin(t/520)*0.05);
  const aA = atk ? -0.5 : 0.9+swing*0.3;
  const hand = arm(skin, atk? -0.2 : 0.95+Math.sin(ph)*(run?0.5:0), atk? -0.9 : 0.5+(run?Math.sin(ph)*0.3:0), shade(acol,-0.05));
  ctx.save(); ctx.translate(hand.x,hand.y);
  const wa = atk ? -1.0 : -0.75 + (run?Math.sin(ph)*0.25:0);
  ctx.rotate(wa);
  // 攻擊弧光
  if(atk){ ctx.strokeStyle=wcol; ctx.globalAlpha=0.45; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(-2,6,24,-1.4,0.9); ctx.stroke(); ctx.globalAlpha=1; }
  const blade=(len,wd)=>{ // 劍/刀
    ctx.fillStyle=leather; ctx.fillRect(-1.2,-2,2.4,6.5);
    ctx.fillStyle="#e0b24a"; ctx.fillRect(-4,-3.4,8,2);
    const gr=ctx.createLinearGradient(0,-3,0,-3-len); gr.addColorStop(0,wcol); gr.addColorStop(1,"#ffffff");
    ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(-wd,-3.4); ctx.lineTo(wd,-3.4); ctx.lineTo(0.4,-3.4-len); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=0.7; ctx.stroke();
  };
  if(wid==="w3"||wid==="w4"||wid==="w6") blade(wid==="w4"?24:21, 2.2);
  else if(wid==="w5"){ ctx.strokeStyle=leather; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(0,-30); ctx.stroke();
    ctx.fillStyle=wcol; ctx.beginPath(); ctx.moveTo(-3,-30); ctx.lineTo(0,-40); ctx.lineTo(3,-30); ctx.lineTo(0,-32); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#d8453a"; ctx.fillRect(-1.6,-29,3.2,2.4); }
  else if(wid==="w7"||wid==="w8"){ ctx.strokeStyle=leather; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(0,-24); ctx.stroke();
    ctx.fillStyle=wcol; ctx.beginPath(); ctx.moveTo(0,-24); ctx.quadraticCurveTo(12,-27,11,-14); ctx.quadraticCurveTo(5,-17,0,-14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=0.7; ctx.stroke();
    ctx.fillStyle=light(wcol); ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(0,-30); ctx.lineTo(2,-24); ctx.closePath(); ctx.fill(); }
  else { // 木棍 / 殳 / 杵：棍身 + 首部
    ctx.strokeStyle=shade(wcol,-0.2); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,7); ctx.lineTo(0,-20); ctx.stroke();
    ctx.strokeStyle=wcol; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(-0.5,7); ctx.lineTo(-0.5,-20); ctx.stroke();
    if(wid!=="w0"){ ctx.fillStyle=wcol; ctx.beginPath(); ctx.ellipse(0,-22,3.6,5.2,0,0,6.2832); ctx.fill(); ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=0.7; ctx.stroke(); }
    else { ctx.fillStyle=shade(wcol,-0.15); ctx.beginPath(); ctx.ellipse(0,-20,2.6,2.2,0,0,6.2832); ctx.fill(); }
  }
  ctx.restore();
  ctx.restore();
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GROUND_Y = 470;
const W = canvas.width, H = canvas.height;   // 視窗大小
const SEGMENTS = 4;
const ZOOM = 1.5;                            // 鏡頭拉近倍率
const VIEW_W = W/ZOOM;
const CAM_Y = (H - H/ZOOM)*0.9;                          // 每關 4 個畫面（一段一段走）
const WORLD_W = SEGMENTS*W;
const HP_SCALE = 2;                          // 怪物血量倍率（配合新的初始武力）

function findWeapon(id){ return WEAPONS.find(w=>w.id===id) || WEAPONS[0]; }
function findArmor(id){ return ARMORS.find(a=>a.id===id) || ARMORS[0]; }

const game = {
  levelIndex:0,
  hp:10, maxHp:10,
  weaponId:"w0", armorId:"a0",
  skillsUnlocked:[],
  activeSkillIdx:-1,
  skillCooldownUntil:0,
  state:"menu", // menu, intro, playing, levelclear, gameover, victory
  inventory:{heal:0, atk:0, def:0},
  monsters:[],
  items:[],
  particles:[],
  killed:0, totalMobs:0,
  keys:{},
  lastTime:0,
  shakeT:0,
  toastT:0,
  player:null,
};

function newPlayer(){
  return {
    x:80, y:GROUND_Y-46, w:34, h:46, vx:0, vy:0, onGround:true,
    facing:1, attackCd:0, hurtCd:0, invuln:0, guard:0, regen:0, nextHitMult:1,
    state:"idle", animT:0,
  };
}

function startGame(){
  game.levelIndex = 0;
  game.hp = 10; game.maxHp = 10;
  game.weaponId = "w0"; game.armorId = "a0";
  game.skillsUnlocked = [];
  game.activeSkillIdx = -1;
  game.inventory = {heal:0, atk:0, def:0};
  updateInventoryHud();
  game.player = newPlayer();
  loadLevel(0);
}

function loadLevel(idx){
  game.levelIndex = idx;
  const lvl = LEVELS[idx];
  game.player = newPlayer();
  game.monsters = [];
  game.items = [];
  game.particles = [];
  // 大地圖：每種異獸各 2 隻，平均散佈在世界中；首領在清完雜兵後現身於地圖最右端
  const MOB_COPIES = 2;
  const nMobs = lvl.mobs.length * MOB_COPIES;
  const segOf = [];
  for(let i=0;i<nMobs;i++) segOf.push(Math.min(SEGMENTS-1, Math.floor(i*SEGMENTS/nMobs)));
  const cnt = {}; segOf.forEach(sg=>cnt[sg]=(cnt[sg]||0)+1);
  const idxIn = {};
  for(let i=0;i<nMobs;i++){
    const sg = segOf[i]; const k = idxIn[sg]=(idxIn[sg]||0);
    idxIn[sg]++;
    const lo = sg*W + (sg===0?480:170), hi = sg*W + W - (sg===SEGMENTS-1?330:170);
    const x = cnt[sg]===1 ? (lo+hi)/2 : lo + (hi-lo)*k/(cnt[sg]-1);
    const def = lvl.mobs[i % lvl.mobs.length];
    const mob = spawnMonster(def, x + rand(-25,25));
    mob.homeX = mob.x;
    game.monsters.push(mob);
  }
  game.bossSpawned = false;
  game.bossDef = lvl.boss;
  game.killed = 0;
  game.totalMobs = nMobs + 1;
  game.camX = 0; game.seg = -1; game.camTarget = 0;
  // 搜尋光點
  for(let i=0;i<8;i++){
    game.items.push({
      kind:"orb", x: (i>>1)*W + (i%2?640:260) + rand(-60,60), y: GROUND_Y-140-rand(0,60), w:16,h:16,
      collected:false, bobT:Math.random()*10,
    });
  }
  game.state = "intro";
  updateHpHud();
  showIntroPanel(lvl);
  render(); // draw one frame behind overlay
}

function spawnMonster(def, x){
  const tierScale = 1;
  return Object.assign({}, def, {
    x, y: def.behavior==='fly' ? GROUND_Y-160-rand(0,40) : GROUND_Y-40,
    w:44,h:40, vx: chance(0.5)?1:-1, vy:0,
    maxHp: Math.max(1,Math.round(def.hp*HP_SCALE)-1), curHp: Math.max(1,Math.round(def.hp*HP_SCALE)-1),
    atkCd: rand(400,900), hurtFlash:0, dead:false, deathT:0,
    flyBase: def.behavior==='fly' ? (GROUND_Y-160-rand(0,40)) : null,
    jumpCd: rand(600,1600),
    isBoss:false,
  });
}
function spawnBoss(def){
  const b = spawnMonster(def, WORLD_W-220);
  b.homeX = b.x;
  b.w=64; b.h=60; b.isBoss=true;
  return b;
}

window.addEventListener('keydown', e=>{
  game.keys[e.key] = true;
  if(game.state==="playing"){
    if(e.key==='x' || e.key==='X') doAttack();
    if(e.key==='c' || e.key==='C') doSkill();
    if(e.key===' ' || e.key==='ArrowUp') doJump();
    if(e.key==='1') useItem('heal');
    if(e.key==='2') useItem('atk');
    if(e.key==='3') useItem('def');
  }
  if(e.key==='i' || e.key==='I'){

});

// touch controls
function bindHold(id, onDown, onUp){
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); onDown(); }, {passive:false});
  el.addEventListener('touchend', e=>{ e.preventDefault(); onUp && onUp(); }, {passive:false});
}
bindHold('tLeft', ()=>game.keys['ArrowLeft']=true, ()=>game.keys['ArrowLeft']=false);
bindHold('tRight', ()=>game.keys['ArrowRight']=true, ()=>game.keys['ArrowRight']=false);
bindHold('tJump', ()=>{ if(game.state==='playing') doJump(); });
bindHold('tAttack', ()=>{ if(game.state==='playing') doAttack(); });
bindHold('tSkill', ()=>{ if(game.state==='playing') doSkill(); });

function doJump(){
  const p = game.player;
  if(p.onGround){ p.vy = -13.5; p.onGround = false; }
}
function doAttack(){
  const p = game.player;
  if(p.attackCd > 0) return;
  p.attackCd = 340;
  p.state = "attack"; p.animT = 0;
  const w = findWeapon(game.weaponId);
  const range = 46;
  const hitbox = { x: p.facing>0 ? p.x+p.w-4 : p.x - range + 4, y:p.y+6, w:range, h:p.h-10 };
  game.monsters.forEach(m=>{
    if(m.dead) return;
    if(aabb(hitbox, m)){
      let dmg = rollDice(w.die) + w.bonus;
      if(p.nextHitMult && p.nextHitMult>1){ dmg *= p.nextHitMult; p.nextHitMult=1; }
      game.damageMonster(m, dmg);
      m.vx += p.facing*2;
    }
  });
}
function doSkill(){
  if(game.skillsUnlocked.length===0) return;
  const latestId = game.skillsUnlocked[game.skillsUnlocked.length-1];
  const sk = SKILLS.find(s=>s.id===latestId);
  const now = performance.now();
  if(now < game.skillCooldownUntil) return;
  sk.activate(game);
  game.skillCooldownUntil = now + sk.cooldown;
}

/* ============================== 戰鬥 / 傷害 ============================== */
game.damageMonster = function(m, dmg){
  if(m.dead) return;
  m.curHp -= dmg;
  m.hurtFlash = 180;
  spawnFloatText(m.x+m.w/2, m.y, `-${dmg}`, "#ffd85c");
  if(m.curHp <= 0){
    m.dead = true; m.deathT = 500;
    onMonsterKilled(m);
  }
};

function onMonsterKilled(m){
  game.killed++;
  updateKillHud();
  const lvl = LEVELS[game.levelIndex];
  // 掉落判定
  if(m.dropWeapon){
    game.weaponId = m.dropWeapon;
    game.toast(`掉落武器：${findWeapon(m.dropWeapon).name}！`);
  } else if(m === game.bossMob){
    // safety
  } else if(m.isBoss){
    // boss without explicit dropWeapon (not used, all bosses have one)
  } else {
    // 一般異獸：第一隻掉防具，其餘有機率掉落藥水
    const idx = lvl.mobs.indexOf(lvl.mobs.find(d=>d.id===m.id));
    if(idx===0 && game.armorId !== lvl.armor){
      game.armorId = lvl.armor;
      game.toast(`掉落防具：${findArmor(lvl.armor).name}！`);
    } else if(chance(0.45)){
      dropConsumable(m.x+m.w/2, m.y);
    }
  }
  if(!m.isBoss && !game.bossSpawned && game.monsters.filter(mm=>!mm.dead && !mm.isBoss).length===0){
    game.bossSpawned = true;
    const boss = spawnBoss(game.bossDef);
    game.bossMob = boss;
    game.monsters.push(boss);
    game.toast(`首領現身於地圖最右端：${game.bossDef.name}！`);
  }
  if(m.isBoss){
    setTimeout(()=>{ game.state="levelclear"; showLevelClearPanel(); }, 700);
  }
}

/* ============================== 更新邏輯 ============================== */
function updatePlayer(dt){
  const p = game.player;
  const speed = 4.2;
  let moving=false;
  if(game.keys['ArrowLeft']){ p.vx=-speed; p.facing=-1; moving=true; }
  else if(game.keys['ArrowRight']){ p.vx=speed; p.facing=1; moving=true; }
  else p.vx=0;

  p.vy += 0.62; // gravity
  p.x += p.vx; p.y += p.vy;
  if(p.y + p.h >= GROUND_Y){ p.y = GROUND_Y - p.h; p.vy=0; p.onGround=true; } else p.onGround=false;
  p.x = clamp(p.x, 0, WORLD_W-p.w);

  if(p.attackCd>0) p.attackCd -= dt;
  if(p.hurtCd>0) p.hurtCd -= dt;
  if(p.invuln>0) p.invuln -= dt;
  if(p.guard>0) p.guard -= dt;
  if(p.regen>0){ p.regen -= dt; if(Math.floor(p.regen/1000) !== Math.floor((p.regen+dt)/1000)){} }
  if(p.regen>0 && Math.random()<0.02){ game.hp = Math.min(game.maxHp, game.hp+1); updateHpHud(); }

  p.animT += dt;
  if(p.attackCd>200) p.state="attack";
  else if(moving) p.state="run"; else p.state="idle";

  // item pickups
  game.items.forEach(it=>{
    if(it.collected) return;
    const box = {x:it.x-10,y:it.y-10,w:20,h:20};
    if(aabb(p, box)){
      it.collected = true;
      applyItemEffect(it);
    }
  });
  game.items = game.items.filter(it=>!it.collected || it._fade);
}

function applyItemEffect(it){
  // 搜尋光點與怪物掉落的藥劑，拾取後收進背包，交由玩家自行按鍵使用
  if(it.kind==='orb'){
    const roll = Math.random();
    const type = roll<0.5 ? 'heal' : (roll<0.75 ? 'atk' : 'def');
    grantItem(type, 1);
  } else if(it.kind==='pot'){
    grantItem(it.type, 1);
  }
}

function grantItem(type, qty){
  qty = qty||1;
  game.inventory[type] = (game.inventory[type]||0) + qty;
  updateInventoryHud();
  game.toast(`獲得${INVENTORY_TYPES[type].label} x${qty}　(按 ${INVENTORY_TYPES[type].key} 使用)`);
}

function useItem(type){
  if(game.state !== 'playing') return;
  const info = INVENTORY_TYPES[type];
  if(!game.inventory[type] || game.inventory[type] <= 0){
    game.toast(`沒有${info.label}`);
    return;
  }
  game.inventory[type]--;
  updateInventoryHud();
  const p = game.player;
  if(type==='heal'){
    const heal = rollDice("1D4");
    game.hp = Math.min(game.maxHp, game.hp+heal);
    updateHpHud();
    game.toast(`使用${info.label}，HP +${heal}`);
  } else if(type==='atk'){
    p.nextHitMult = 2;
    game.toast(`使用${info.label}，下一擊傷害加倍`);
  } else if(type==='def'){
    p.guard = 3000;
    game.toast(`使用${info.label}，短暫大幅減傷`);
  }
}

function updateInventoryHud(){
  ['heal','atk','def'].forEach(type=>{
    const count = game.inventory[type]||0;
    const countEl = document.getElementById('inv'+type[0].toUpperCase()+type.slice(1)+'Count');
    const btnEl = document.getElementById('inv'+type[0].toUpperCase()+type.slice(1));
    if(countEl) countEl.textContent = count;
    if(btnEl) btnEl.disabled = count<=0;
  });
}

function updateMonster(m, dt){
  if(m.dead){ return; }
  const p = game.player;
  if(m.stun && m.stun>0){ m.stun -= dt; return; }
  const dx = (p.x+p.w/2) - (m.x+m.w/2);
  const dist = Math.abs(dx);
  const dir = dx>0?1:-1;

  if(m.behavior==='fly'){
    m.vy = 0;
    const targetY = dist < 220 ? p.y - 10 : m.flyBase;
    m.y += (targetY - m.y) * 0.02;
    m.y += Math.sin(performance.now()/300 + m.seed)*0.4;
    if(dist<200){ m.vx = dir*1.6; }
    else {
      const hx = (m.homeX!=null)? m.homeX : m.x;
      m.vx = Math.sin(performance.now()/900+m.seed)*1 + clamp((hx - m.x)/200, -1, 1)*0.8;
    }
  } else {
    m.vy += 0.62;
    if(m.behavior==='jump'){
      m.jumpCd -= dt;
      if(m.jumpCd<=0 && m.y+m.h>=GROUND_Y-2){
        m.vy = -10 - Math.random()*3;
        m.jumpCd = rand(1200,2400);
      }
    }
    if(dist<180){ m.vx = dir*1.3; }
    else {
      const hx = (m.homeX!=null)? m.homeX : m.x;
      const pull = clamp((hx - m.x)/200, -1, 1);
      m.vx = Math.sin(performance.now()/1400 + m.seed)*0.5 + pull*0.5;
    }
  }
  m.x += m.vx; m.y += m.vy;
  if(m.behavior!=='fly'){
    if(m.y+m.h >= GROUND_Y){ m.y = GROUND_Y-m.h; m.vy=0; }
  } else {
    m.y = clamp(m.y, 40, GROUND_Y-100);
  }
  m.x = clamp(m.x, 0, WORLD_W-m.w);

  m.atkCd -= dt;
  if(aabb(m,p) && m.atkCd<=0){
    m.atkCd = rand(700,1200);
    tryHitPlayer(m);
  }
  if(m.hurtFlash>0) m.hurtFlash -= dt;
}

function tryHitPlayer(m){
  const p = game.player;
  if(p.invuln>0) return;
  // AC-style dodge: armor gives partial chance to avoid
  const armor = findArmor(game.armorId);
  const dodge = clamp(armor.ac*0.03, 0, 0.35);
  if(Math.random() < dodge){ spawnFloatText(p.x+p.w/2, p.y, "閃避!", "#7fd0c8"); return; }
  let dmg = Math.max(1, rollDice(m.dmg) - 1);
  dmg = Math.max(1, dmg - Math.floor(armor.ac/2));
  if(p.guard>0) dmg = Math.max(1, Math.ceil(dmg*0.35));
  game.hp -= dmg;
  p.invuln = 650;
  p.hurtCd = 300;
  spawnFloatText(p.x+p.w/2, p.y, `-${dmg}`, "#e0526b");
  game.shakeT = 200;
  updateHpHud();
  if(game.hp<=0){
    game.hp=0; updateHpHud();
    game.state="gameover";
    setTimeout(showGameOverPanel, 400);
  }
}

const HEART_ICON_PATH = "M12 21s-7.5-4.7-10-9.2C0.3 8.6 2 5 5.6 5c2 0 3.4 1.2 4.4 2.7C11 6.2 12.4 5 14.4 5 18 5 19.7 8.6 22 11.8 19.5 16.3 12 21 12 21z";

/* ============================== 場景：山光水色（每關 4 段，一段一個畫面） ============================== */
function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function ridge(x,seed,sharp){
  const v = Math.sin(x*0.0045+seed)*0.5 + Math.sin(x*0.011+seed*2.3)*0.3 + Math.sin(x*0.027+seed*4.1)*0.2;
  return sharp ? 1-Math.abs(v)*1.15 : (v+1)/2;
}
function drawRidge(x0,x1,baseY,amp,seed,sharp,fill,fog){
  ctx.beginPath(); ctx.moveTo(x0,H);
  for(let x=x0;x<=x1;x+=12) ctx.lineTo(x, baseY-amp*ridge(x,seed,sharp));
  ctx.lineTo(x1,H); ctx.closePath();
  const g=ctx.createLinearGradient(0,baseY-amp,0,baseY+10);
  g.addColorStop(0,fill); g.addColorStop(1,fog||fill);
  ctx.fillStyle=g; ctx.fill();
}
function blob(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }

    for(let i=0;i<9;i++){ const yy=y0+4+i*7, ww=(cel.r*(1.2-i*0.07))*(1+Math.sin(t/500+i)*0.12); ctx.fillRect(rx-ww/2,yy,ww,3); } }
  ctx.strokeStyle='rgba(255,255,255,0.20)'; ctx.lineWidth=1.5;
  for(let i=0;i<24;i++){ const yy=y0+5+hash(i+sx)*(y1-y0-10), xx=sx+((hash(i*3+sx)*W+t*0.012*(1+hash(i)))%W), len=14+hash(i*5)*44; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(Math.min(xx+len,sx+W),yy); ctx.stroke(); }
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(sx,y0,W,3);
}
function drawGround(x0,x1,th){
  const g=ctx.createLinearGradient(0,GROUND_Y,0,H); g.addColorStop(0,th.ground[0]); g.addColorStop(1,th.ground[1]);
  ctx.fillStyle=g; ctx.fillRect(x0,GROUND_Y,x1-x0,H-GROUND_Y);
  ctx.fillStyle=rgba(th.grass||'#555555',0.9); ctx.fillRect(x0,GROUND_Y,x1-x0,5);
  for(let x=Math.floor(x0/26)*26;x<=x1;x+=26){ const h=5+hash(x)*11; ctx.beginPath(); ctx.moveTo(x,GROUND_Y+2); ctx.lineTo(x+4,GROUND_Y-h); ctx.lineTo(x+9,GROUND_Y+2); ctx.fill(); }
  ctx.fillStyle='rgba(255,255,255,0.05)'; for(let x=Math.floor(x0/90)*90;x<=x1;x+=90) ctx.fillRect(x+hash(x)*40, GROUND_Y+18+hash(x+1)*34, 22+hash(x+2)*30, 3);
}

/* ---- 繪製整個場景（在世界座標下呼叫，已 translate(-camX)） ---- */
function drawScene(lvlIdx, camX, t){
  const th=THEMES[lvlIdx]; if(!th) return;
  const x0=Math.floor(camX/12)*12-12, x1=camX+W+24;
  const s0=clamp(Math.floor(camX/W),0,SEGMENTS-1), s1=clamp(Math.floor((camX+W-1)/W),0,SEGMENTS-1);
  // 天空
  const g=ctx.createLinearGradient(0,0,0,GROUND_Y); g.addColorStop(0,th.sky[0]); g.addColorStop(0.55,th.sky[1]); g.addColorStop(1,th.sky[2]);
  ctx.fillStyle=g; ctx.fillRect(camX-2,0,W+4,H);
  // 星空
  if(th.stars>0){ for(let i=0;i<90;i++){ const sx=hash(i*1.7)*WORLD_W, sy=hash(i*2.9+5)*300; if(sx<camX-4||sx>camX+W+4) continue;
    ctx.globalAlpha=th.stars*(0.35+0.65*Math.abs(Math.sin(t/900+i))); ctx.fillStyle='#fff'; ctx.fillRect(sx,sy,i%7===0?2.4:1.4,i%7===0?2.4:1.4); } ctx.globalAlpha=1; }
  // 日月
  for(let s=s0;s<=s1;s++){ const sg=th.segs[s]; if(sg.cel){ const dd=Math.abs(camX+VIEW_W/2-(s*W+sg.cel.x)); ctx.globalAlpha=clamp(1-(dd-260)/340,0,1); if(ctx.globalAlpha>0) drawCel(sg.cel, s*W, t); ctx.globalAlpha=1; } }
  // 風暴雲
  for(let s=s0;s<=s1;s++){ if(!th.segs[s].storm) continue; ctx.fillStyle='rgba(30,20,40,0.55)';
    for(let i=0;i<7;i++){ const cx=s*W+80+i*140+Math.sin(t/3000+i)*14, cy=70+hash(i+s*9)*60; ctx.beginPath(); ctx.ellipse(cx,cy,110,34,0,0,6.2832); ctx.fill(); ctx.ellipse(cx+40,cy+16,90,28,0,0,6.2832); ctx.fill(); }
    if(Math.sin(t/1300+s)>0.93){ ctx.strokeStyle='rgba(255,255,230,0.95)'; ctx.lineWidth=3; const bx=s*W+300+hash(Math.floor(t/1300))*400; ctx.beginPath(); ctx.moveTo(bx,90); ctx.lineTo(bx-18,190); ctx.lineTo(bx+8,196); ctx.lineTo(bx-26,330); ctx.stroke(); ctx.fillStyle='rgba(255,255,240,0.10)'; ctx.fillRect(s*W,0,W,H); } }
  // 遠山、霧、近山
  const R0=th.ridges[0], R1=th.ridges[1];
  drawRidge(x0,x1,R0.base,R0.amp,R0.seed,R0.sharp,R0.c,R0.f);
  const mg=ctx.createLinearGradient(0,300,0,430); mg.addColorStop(0,'rgba(0,0,0,0)'); mg.addColorStop(0.6,th.mist); mg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=mg; ctx.fillRect(x0,300,x1-x0,130);
  drawRidge(x0,x1,R1.base,R1.amp,R1.seed,R1.sharp,R1.c,R1.f);
  // 每段：陸地／水面 + 遠景
  for(let s=s0;s<=s1;s++){ const sg=th.segs[s], sx=s*W;
    if(sg.water) drawWater(sx,th,sg.cel,t); else drawLand(sx,th);
    sg.far.forEach(([n,x,sc])=>PROP[n](sx+x,412,sc*0.78,t,th));
    if(sg.mist){ const m2=ctx.createLinearGradient(0,330,0,GROUND_Y); m2.addColorStop(0,'rgba(0,0,0,0)'); m2.addColorStop(1,sg.mist); ctx.fillStyle=m2;
      for(let q=0;q<W;q+=20){ const e=Math.min(s>0?q+10:999, s<SEGMENTS-1?W-q-10:999); ctx.globalAlpha=clamp(e/140,0,1); ctx.fillRect(sx+q,330,20.5,GROUND_Y-330); } ctx.globalAlpha=1; }
  }
  // 交界羽化：水面 ↔ 陸地
  { const lg=ctx.createLinearGradient(0,410,0,GROUND_Y); lg.addColorStop(0,th.landTop||th.land); lg.addColorStop(1,th.land); ctx.fillStyle=lg;
    for(let s=0;s<SEGMENTS-1;s++){ const a=th.segs[s], b=th.segs[s+1]; if(!!a.water===!!b.water) continue;
      const bx=(s+1)*W, wl=a.water?-1:1; // wl=-1: 水在左側
      for(let i=0;i<16;i++){ const al=Math.pow(1-i/16,1.3)*0.97; ctx.globalAlpha=al;
        if(wl<0) ctx.fillRect(bx-(i+1)*10,410,10.5,GROUND_Y-410); else ctx.fillRect(bx+i*10,410,10.5,GROUND_Y-410); } }
    ctx.globalAlpha=1; }
  // 地面、近景
  drawGround(x0,x1,th);
  for(let s=s0;s<=s1;s++){ const sg=th.segs[s], sx=s*W;
    sg.near.forEach(([n,x,sc])=>PROP[n](sx+x,GROUND_Y+3,sc,t,th)); }
}

/* ---- 螢幕空間的氣候粒子 + 暗角 ---- */
function drawAmbient(lvlIdx, seg, t){
  const th=THEMES[lvlIdx]; if(!th) return; const kind=(th.segs[seg]&&th.segs[seg].amb)||th.amb;
  for(let i=0;i<46;i++){
    const r1=hash(i*1.3), r2=hash(i*2.1+3), r3=hash(i*3.7+7);
    if(kind==='sakura'){ const x=((r1*W + t*0.03*(0.6+r3) + Math.sin(t/900+i)*18)%W+W)%W, y=((r2*H + t*0.045*(0.7+r3))%H); ctx.fillStyle='rgba(255,176,200,0.85)'; ctx.beginPath(); ctx.ellipse(x,y,4,2.4,t/600+i,0,6.2832); ctx.fill(); }
    else if(kind==='snow'){ const x=((r1*W + Math.sin(t/1200+i)*22)%W+W)%W, y=((r2*H + t*0.05*(0.5+r3))%H); ctx.fillStyle='rgba(255,255,255,0.8)'; blob(x,y,1.2+r3*2); }
    else if(kind==='ember'){ const x=((r1*W + Math.sin(t/800+i)*16)%W+W)%W, y=H-((r2*H + t*0.035*(0.5+r3))%H); ctx.fillStyle=`rgba(255,${120+r3*100|0},60,${0.35+r3*0.5})`; blob(x,y,1+r3*2); }
    else if(kind==='leaf'){ const x=((r1*W + t*0.025*(0.6+r3))%W), y=((r2*H + t*0.03*(0.5+r3) + Math.sin(t/700+i)*10)%H); ctx.fillStyle='rgba(150,130,60,0.7)'; ctx.beginPath(); ctx.ellipse(x,y,4,2,t/500+i,0,6.2832); ctx.fill(); }
    else if(kind==='dust'){ if(i>26) continue; const x=((r1*W + t*0.06*(0.5+r3))%W), y=r2*H*0.9+60; ctx.fillStyle='rgba(255,220,170,0.28)'; ctx.fillRect(x,y,10+r3*18,1.4); }
  }
  // 暗角
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*1.0); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.38)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ============================== 渲染 ============================== */
function render(){
  const lvl = LEVELS[game.levelIndex] || LEVELS[0];
  ctx.save();
  if(game.shakeT>0){
    ctx.translate(rand(-4,4), rand(-4,4));
  }
  const camX = game.camX||0;
  const t = performance.now();
  // 世界座標（鏡頭捲動）
  ctx.save();
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-camX, -CAM_Y);
  drawScene(game.levelIndex, camX, t);

  // items
  game.items.forEach(it=>{
    if(it.collected) return;
    if(it.kind==='orb'){
      const b = Math.sin(t/300+it.bobT)*6;
      ctx.save(); ctx.translate(it.x, it.y+b);
      ctx.fillStyle="rgba(224,168,60,0.25)";
      ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#e0a83c";
      ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(it.kind==='pot'){
      it.y += it.vy*0.2; it.vy = clamp(it.vy+0.2, -3, 0);
      const cols = {heal:"#e0526b", atk:"#e0a83c", def:"#7fd0c8"};
      ctx.fillStyle = cols[it.type];
      ctx.beginPath(); ctx.arc(it.x, it.y, 7,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(it.x, it.y, 7,0,Math.PI*2); ctx.stroke();
    }
  });

  // monsters
  game.monsters.forEach(m=>{
    if(m.dead && m.deathT<=0) return;
    ctx.save();
    if(m.dead){
      const a = clamp(m.deathT/500,0,1);
      ctx.globalAlpha = a;
      ctx.translate(0, (1-a)*20);
    }
    if(m.hurtFlash>0){
      ctx.filter = "brightness(1.8) saturate(0.4)";
    }
    const facing = (game.player.x > m.x) ? 1 : -1;
    drawMonsterIcon(ctx, m, m.x, m.y, m.w, m.h, facing, t + (m.seed*1000));
    ctx.restore();
    // hp bar
    if(!m.dead){
      const bw = m.isBoss? m.w+20 : m.w;
      ctx.fillStyle="rgba(0,0,0,0.5)";
      ctx.fillRect(m.x-(bw-m.w)/2, m.y-14, bw, 5);
      ctx.fillStyle = m.isBoss? "#e0526b":"#e0a83c";
      ctx.fillRect(m.x-(bw-m.w)/2, m.y-14, bw*clamp(m.curHp/m.maxHp,0,1), 5);
      if(m.isBoss){
        ctx.fillStyle="#fff"; ctx.font="11px sans-serif"; ctx.textAlign="center";
        ctx.fillText(m.name, m.x+m.w/2, m.y-18);
      }
    }
  });

  // player
  const p = game.player;
  ctx.save();
  if(p.invuln>0 && Math.floor(t/80)%2===0) ctx.globalAlpha=0.4;
  if(p.guard>0){
    ctx.strokeStyle="rgba(127,208,200,0.6)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x+p.w/2,p.y+p.h/2, 34,0,Math.PI*2); ctx.stroke();
  }
  drawPlayerIcon(ctx, p.x, p.y, p.w, p.h, p.facing, t, p.state, findWeapon(game.weaponId), findArmor(game.armorId));
  ctx.restore();

  // particles (float text)
  game.particles.forEach(fp=>{
    const a = clamp(1 - fp.t/fp.life, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = fp.color;
    ctx.font="bold 14px sans-serif"; ctx.textAlign="center";
    ctx.fillText(fp.text, fp.x, fp.y - (fp.t/fp.life)*24);
  });
  ctx.globalAlpha=1;

  ctx.restore(); // 結束世界座標

  drawAmbient(game.levelIndex, game.seg||0, t);
  drawMinimap(camX);

  ctx.restore();
}

function drawMinimap(camX){
  const mw = 240, mh = 22, mx = W - mw - 12, my = 12;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1;
  ctx.strokeRect(mx+.5, my+.5, mw-1, mh-1);
  const sx = x => mx + (x/WORLD_W)*mw;
  // 視窗範圍
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.fillRect(sx(camX), my, (VIEW_W/WORLD_W)*mw, mh);
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  for(let i=1;i<SEGMENTS;i++) ctx.fillRect(mx+i*mw/SEGMENTS-0.5, my, 1, mh);
  // 光點
  ctx.fillStyle = "#e0a83c";
  game.items.forEach(it=>{ if(it.kind==='orb' && !it.collected) ctx.fillRect(sx(it.x)-1, my+mh-6, 2, 3); });
  // 怪物
  game.monsters.forEach(m=>{
    if(m.dead) return;
    ctx.fillStyle = m.isBoss ? "#ff4d6a" : "#c98cff";
    const r = m.isBoss ? 4 : 2.2;
    ctx.beginPath(); ctx.arc(sx(m.x+m.w/2), my+mh/2, r, 0, Math.PI*2); ctx.fill();
  });
  // 玩家
  const p = game.player;
  ctx.fillStyle = "#7fd0c8";
  ctx.beginPath(); ctx.arc(sx(p.x+p.w/2), my+mh/2, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ============================== 主迴圈 ============================== */
function announceSegment(seg){
  const th = THEMES[game.levelIndex]; if(!th) return;
  const nm = th.names && th.names[seg]; if(nm) game.toast("【"+(seg+1)+"/"+SEGMENTS+"】"+nm);
}
function loop(now){
  const dt = Math.min(40, now - (game.lastTime||now));
  game.lastTime = now;

  if(game.state==="playing"){
    updatePlayer(dt);
    {
      const pc = game.player.x + game.player.w/2;
      const seg = clamp(Math.floor(pc/W), 0, SEGMENTS-1);
      if(seg !== game.seg){ game.seg = seg; announceSegment(seg); }
      const target = clamp(pc - VIEW_W/2 + game.player.facing*50, 0, WORLD_W - VIEW_W);
      game.camX = (game.camX||0) + (target - (game.camX||0))*0.09;
    }
    game.monsters.forEach(m=>updateMonster(m,dt));
    game.monsters = game.monsters.filter(m=> !(m.dead && m.deathT<=0) );
    game.monsters.forEach(m=>{ if(m.dead) m.deathT -= dt; });
    game.particles.forEach(fp=>fp.t+=dt);
    game.particles = game.particles.filter(fp=>fp.t<fp.life);
    if(game.shakeT>0) game.shakeT -= dt;
    updateHud();
  }
  render();
  requestAnimationFrame(loop);
}

// PWA：註冊 service worker，讓遊戲可安裝並離線遊玩（在非 http(s) 環境自動略過）
try{
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}catch(e){}
// 禁止長按選單（手機按住按鈕時避免跳出）
window.addEventListener('contextmenu', e=>e.preventDefault());

game.player = newPlayer();
updateHpHud();
updateInventoryHud();
showStartPanel();
requestAnimationFrame(loop);

window.__gameStateDebug = function(){
  return {
    state: game.state,
    hp: game.hp, maxHp: game.maxHp,
    levelIndex: game.levelIndex,
    killed: game.killed, totalMobs: game.totalMobs,
    weaponId: game.weaponId, armorId: game.armorId,
    monsterCount: game.monsters.length,
    playerX: game.player && game.player.x,
    camX: game.camX,
    nextHitMult: game.player && game.player.nextHitMult,
    guard: game.player && game.player.guard,
    skillsUnlocked: game.skillsUnlocked.slice(),
    inventory: Object.assign({}, game.inventory),
  };
};

})();
</script>
